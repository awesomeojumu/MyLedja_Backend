name: ci

on:
  push:
    branches: [dev, staging, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apptest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --verbose --no-git

      - run: npm run apptest
